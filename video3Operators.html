<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //operators
        /*
        1.Arithmetic operators
        2.Assignment operators
        3.comparison operators
        4.logical operators
        5.string operators
        */

        //1.Arithmetic operators -used to perform basic maths operations
        //1.1 Addition  (+)
        console.log("Arithmetic operation");
        let sum=5+3;
        console.log("Addition"+sum);

        //1.2 Subtraction  (-)
        let differnce=10-2;
        console.log("Subtraction "+differnce);

        //1.3 Multiplication  (*)
        let product=2*2;
        console.log("Multiplication "+product);

        //1.4 Division  (/)
        let x=12/2;
        console.log("Division "+x);

        //1.5 Modulus  (%)
        let remainder=10%3;
        console.log("Modulus "+remainder);

        //1.6 Exponentiation  (**)
        let exp=2**3;
        console.log("Exponentiation "+exp);

        //1.7 Increment (++)
        let a=1;
        console.log("Post Increment "+a++);
        console.log(a);

        let b=1;
        console.log("Pre Increment "+ ++b);
        console.log(b);

        //1.8 Decrement (--)
        let c=5;
        console.log("Post Decrement "+ c--);
        console.log(c);

        let d=5;
        console.log("Pre Decrement "+ --d);
        console.log(d);

        //2.Assignment operators
        //2.1  Assignment(=)
        console.error('assignment operator');
        let z=10;
        console.log("Assignment"+z);

        //2.2 Additon assignment
        z+=5;
        console.log("Addition assignment "+z);

        //2.3 subtraction assignment
        z-=5;
        console.log("Subtraction assignment"+z);

        //2.4 Multiplication assignment
        z*=2;
        console.log("Multiplication assignment "+z);

        //2.5 Division assignment 
        z/=1;
        console.log("Division assignment "+z);

        //2.6 Modulus assignment 
        z%=3;
        console.log("Modulus assignment "+z);
    </script>
</body>
</html>
