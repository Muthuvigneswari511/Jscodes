<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome number</title>
</head>
<body>
    <script>
        let number=10;
        let num=number;
        let remainder,reverse=0;
        while(number!=0){
            remainder=number%10;
            reverse=reverse*10+remainder;
            number=number/10;
        }
        console.log(num==reverse?"palindrome":"not palindrome");
    </script>
    
</body>
</html>
