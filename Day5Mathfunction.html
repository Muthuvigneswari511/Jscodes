<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math functions</title>
</head>
<body>
    <script>
        //math constants
        console.log(Math.E);
        console.log(Math.PI);
        console.log(Math.sqrt);
        console.log(Math.SQRT1_2);
        console.log(Math.LN2);
        console.log(Math.LN10);
        console.log(Math.LOG2E);
        console.log(Math.LOG10E);

        //math functions
        console.log(Math.max(10,2));
        console.log(Math.min(10,2));
        console.log(Math.abs(-10));
        console.log(Math.round(3.12));
        console.log(Math.floor(3.12));
        console.log(Math.ceil(3.12));
        console.log(Math.floor(Math.random()*10));

        //trigonometry functions
        console.log(Math.sin(100));
        console.log(Math.asin(0));
        console.log(Math.cos(20));
        console.log(Math.acos(-1));
        console.log(Math.tan(20));
        console.log(Math.atan(1/2))
    </script>
    
</body>
</html>
