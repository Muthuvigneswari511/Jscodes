<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional statements</title>
</head>

<body>
    <script>
        let a=Number(prompt("Enter first number"));
        let b=Number(prompt("Enter second number"))
        let num = Number(prompt("Enter a number to perform operation"));
        if(num==1){
            console.log("a+b "+(a+b));
        }
        else if(num==2){
            console.log("a-b "+(a-b));
        }
        else if(num==3){
            console.log("a*b "+(a*b));
        }
        else if(num==4){
            console.log("a/b "+(a/b));
        }
        else{
            console.log("Invalid number");
        }
    </script>
</body>

</html>
