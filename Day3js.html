<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional statements</title>
</head>

<body>
    <script>
        let a=Number(prompt("Enter first number"));
        let b=Number(prompt("Enter second number"))
        let num = Number(prompt("Enter a number to perform operation"));
        switch (num) {
            case 1:
                console.log("a+b ", (a + b));
                break;
            case 2: 
                console.log("a-b ", (a - b));
                break;
            case 3:
                console.log("a*b ", (a * b));
                break;
            case 4:
                if(a&&b!=0){
                console.log("a/b ", (a / b));
                break;
                }
                else{
                    console.log("Division by 0 not allowed");
                }
            
        }
    </script>
</body>

</html>
