<!DOCTYPE html>
<html>
<head>
    <title>Cart Example</title>
</head>
<body>

    <button id="item1">Cart Item 1</button>
    <button id="item2">Cart Item 2</button>
    <button id="item3">Cart Item 3</button>

    <script>

        // Select buttons
        let btn1 = document.getElementById("item1");
        let btn2 = document.getElementById("item2");
        let btn3 = document.getElementById("item3");

        // Add Event Listeners
        btn1.addEventListener("click", function(){
            addToCart("Cart Item 1");
        });

        btn2.addEventListener("click", function(){
            addToCart("Cart Item 2");
        });

        btn3.addEventListener("click", function(){
            addToCart("Cart Item 3");
        });

        // Cart Function
        function addToCart(itemName){

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push(itemName);

            localStorage.setItem("cart", JSON.stringify(cart));

            alert(itemName + " added to cart");
        }

    </script>

</body>
</html>
