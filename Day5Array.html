<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
</head>
<body>
    <script>
        //literal create of array
        let num=[1,2,3,4,5];
        console.log(num);
        console.log(num[0]);
        console.log(num[1]);
        console.log(num[2]);
        console.log(num[3]);
        console.log(num[4]);

        //new keyword
        let array=new Array();
        array[0]="Hii";
        console.log(array);
    </script>
</body>
</html>
