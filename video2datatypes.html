<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
        Javascript is dynamic typing
        primitive and non primitive types
         */
        //1.primitive types
          //  1.Number -represents both integers and floating point numbers
          let age=25;
          console.log(typeof age)
          let price=13.33
          console.log(typeof price);

          // 2.String - represents a sequence of characters
          let ag="25";
          console.log(typeof ag)

          let greetings='Hello, world';
          console.log(typeof greetings);

          //3.boolean - represents a logical entity can have true or false
          let isActive=true;
          let hasLicense=false;
          console.log(isActive);
          console.log(hasLicense);

          //4.undefined - a variable that has been declared but not initialized a value
          let uninitialized;
          console.log(uninitialized);

          //5.null - represents the intentional absence of any value
          let box=null;
          console.log(box);

          //6.symbols -represents a unique and immutable value often used in a object property key
          let unique=Symbol('key');
          console.log(unique);

          //7.BigInt - represents to store large integer number 
          let large=8957348538457349n;
          console.log(large);

        //2.Non primitive data types
            //1.object -represents a collection of properties, each consisting 
            // a key(usually a string) and value(any datatype)
            let person={
                name:"muthu",
                age:22,
                isEmployed:true,
            };
            console.log(person);
            console.log(person.age);
            console.log(person.name);
            console.log(person.isEmployed);

            let emptyObject={};
            console.log(emptyObject);

            //2.arrays - a special type of object used for storing collection of values
            let numbers=[1,2,3,4,5];
            console.log(numbers);
            
            let mixedData=[1 ,'two',true,null];
            console.log(mixedData);

            //3.functions - special type of object that can callable and perform action
            function invite(){
                console.log("Invited");
            }
            invite();

            //4.Date - built-in object to handle date and times
            let now=new Date();
            console.log(now);
            console.log(now.getDate());
            console.log(now.getDay());
            console.log(now.getMonth())
    </script>
</body>
</html>
