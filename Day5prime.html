<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime number</title>
</head>
<body>
    <script>
        let n=12;
        let isPrime=true;
        if(n<=1){
            isPrime=false;
        }
        else{
            for(let i=2;i<n/2;i++){
                if(n%i==0){
                    isPrime=false;
                    break;
                }
            }
        }
        console.log(isPrime?'Prime number':'not a prime number');
    </script>
    
</body>
</html>
