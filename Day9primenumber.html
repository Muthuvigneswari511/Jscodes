<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime number</title>
</head>
<body>
    <script>
        let number=14;
        let isPrime=true;
        if(number<=1){
            console.log("not a prime number");
        }
        for(let i=2;i<number/2;i++){
            if(i%2==0){
                isPrime=false;
                break;
            }
        }
        console.log(isPrime?"prime number":"not a prime number")

    </script>
</body>
</html>
